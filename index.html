<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d9488">
  <meta name="description" content="专升本备考学习记录工具：每日打卡、每周目标与复盘、倒计时、数据备份。">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="apple-touch-icon" href="assets/icon.svg">
  <title>学习记录</title>

  <!-- 主题变量（与设计稿一致）-->
  <link rel="stylesheet" href="css/theme.css">
  <!-- Tailwind CDN（与设计稿一致）-->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
  <!-- Lucide 图标 -->
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style type="text/tailwindcss">
    @theme inline {
      --color-background: var(--brand-background);
      --color-foreground: var(--brand-foreground);
      --color-card: var(--brand-card);
      --color-card-foreground: var(--brand-card-foreground);
      --color-popover: var(--brand-popover);
      --color-popover-foreground: var(--brand-popover-foreground);
      --color-primary: var(--brand-primary);
      --color-primary-foreground: var(--brand-primary-foreground);
      --color-muted: var(--brand-muted);
      --color-muted-foreground: var(--brand-muted-foreground);
      --color-border: var(--brand-border);
      --color-input: var(--brand-input);
      --color-ring: var(--brand-ring);
      --radius-sm: var(--brand-radius-sm);
      --radius-md: var(--brand-radius-md);
      --radius-lg: var(--brand-radius-lg);
    }
    @layer base {
      body { background: var(--brand-background); color: var(--brand-foreground); }
      td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
      th { @apply whitespace-nowrap; }
    }
  </style>
  <!-- 语义色 token 兜底（与设计稿一致）-->
  <style>
    .bg-background { background-color: var(--brand-background); }
    .text-background { color: var(--brand-background); }
    .border-background { border-color: var(--brand-background); }
    .bg-foreground { background-color: var(--brand-foreground); }
    .text-foreground { color: var(--brand-foreground); }
    .border-foreground { border-color: var(--brand-foreground); }
    .bg-card { background-color: var(--brand-card); }
    .text-card { color: var(--brand-card); }
    .border-card { border-color: var(--brand-card); }
    .text-card-foreground { color: var(--brand-card-foreground); }
    .bg-card-foreground { background-color: var(--brand-card-foreground); }
    .bg-popover { background-color: var(--brand-popover); }
    .text-popover { color: var(--brand-popover); }
    .border-popover { border-color: var(--brand-popover); }
    .bg-popover-foreground { background-color: var(--brand-popover-foreground); }
    .text-popover-foreground { color: var(--brand-popover-foreground); }
    .bg-primary { background-color: var(--brand-primary); }
    .text-primary { color: var(--brand-primary); }
    .border-primary { border-color: var(--brand-primary); }
    .bg-primary-foreground { background-color: var(--brand-primary-foreground); }
    .text-primary-foreground { color: var(--brand-primary-foreground); }
    .bg-muted { background-color: var(--brand-muted); }
    .text-muted { color: var(--brand-muted); }
    .border-muted { border-color: var(--brand-muted); }
    .bg-muted-foreground { background-color: var(--brand-muted-foreground); }
    .text-muted-foreground { color: var(--brand-muted-foreground); }
    .border-muted-foreground { border-color: var(--brand-muted-foreground); }
    .bg-border { background-color: var(--brand-border); }
    .text-border { color: var(--brand-border); }
    .border-border { border-color: var(--brand-border); }
    .bg-input { background-color: var(--brand-input); }
    .text-input { color: var(--brand-input); }
    .border-input { border-color: var(--brand-input); }
    .bg-ring { background-color: var(--brand-ring); }
    .text-ring { color: var(--brand-ring); }
    .border-ring { border-color: var(--brand-ring); }
  </style>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="min-h-screen font-sans antialiased">
  <main class="bg-background text-foreground">

    <!-- ===== 顶部 Header ===== -->
    <header id="header" class="sticky top-0 z-30 border-b border-border bg-background/95 backdrop-blur">
      <div class="mx-auto max-w-6xl px-4 py-4">

        <!-- 顶部标题行 + 主题切换 -->
        <div class="flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
          <div class="flex items-start justify-between gap-2">
            <div>
              <h1 class="text-2xl font-bold tracking-tight text-foreground">学习记录</h1>
              <p class="mt-1 text-sm text-muted-foreground">2026-09-16（周三）至 2027-03-10（周三）</p>
            </div>
            <button id="btn-theme-toggle" class="inline-flex items-center justify-center rounded-md border border-border bg-card p-2 text-foreground hover:bg-muted" aria-label="切换深浅主题" title="切换深浅主题 (快捷键 D)">
              <i data-lucide="sun-moon" class="h-4 w-4"></i>
            </button>
          </div>

          <!-- 统计卡片：6 项 -->
          <div class="grid grid-cols-2 gap-3 sm:grid-cols-6">
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="text-xs text-muted-foreground">总天数</div>
              <div id="stat-total" class="text-xl font-semibold text-foreground">176</div>
            </div>
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="text-xs text-muted-foreground">目标完成天数</div>
              <input type="number" id="stat-target" min="0" step="1" value="" placeholder="0" class="w-full bg-transparent text-center text-xl font-semibold text-foreground placeholder:text-muted-foreground focus:outline-none">
              <div id="stat-target-progress" class="text-[10px] text-muted-foreground">完成 0%</div>
            </div>
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="text-xs text-muted-foreground">已过天数</div>
              <div id="stat-passed" class="text-xl font-semibold text-foreground">0</div>
            </div>
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="text-xs text-muted-foreground">剩余天数</div>
              <div id="stat-remaining" class="text-xl font-semibold text-foreground">176</div>
            </div>
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="text-xs text-muted-foreground">已完成天数</div>
              <div id="stat-completed" class="text-xl font-semibold text-[var(--brand-primary)]">0</div>
            </div>
            <div class="rounded-lg border border-border bg-card p-3 text-center">
              <div class="flex items-center justify-center gap-1">
                <div class="text-xs text-muted-foreground truncate" id="countdown-label">专升本考试</div>
                <button id="btn-countdown-settings" class="inline-flex text-muted-foreground hover:text-foreground" aria-label="设置倒计时">
                  <i data-lucide="settings" class="h-3 w-3"></i>
                </button>
              </div>
              <div id="countdown-display" class="text-xl font-semibold text-foreground">176天</div>
              <div id="countdown-sub" class="text-xs text-muted-foreground">00:00:00</div>
              <div id="countdown-form" class="hidden mt-3 space-y-2 text-left">
                <div>
                  <label class="block text-xs text-muted-foreground">倒计时名称</label>
                  <input type="text" id="countdown-label-input" class="w-full rounded-md border border-border bg-background px-2 py-1 text-sm text-foreground placeholder:text-muted-foreground focus:border-[var(--brand-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--brand-ring)]" placeholder="例如：专升本考试">
                </div>
                <div>
                  <label class="block text-xs text-muted-foreground">目标日期时间</label>
                  <input type="datetime-local" id="countdown-target-input" class="w-full rounded-md border border-border bg-background px-2 py-1 text-sm text-foreground focus:border-[var(--brand-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--brand-ring)]">
                </div>
                <div class="flex gap-2">
                  <button id="btn-countdown-save" class="flex-1 rounded-md bg-primary px-2 py-1.5 text-xs font-medium text-primary-foreground hover:opacity-90">保存</button>
                  <button id="btn-countdown-cancel" class="flex-1 rounded-md border border-border bg-background px-2 py-1.5 text-xs font-medium text-foreground hover:bg-muted">取消</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 数据备份行 -->
        <div class="mt-3 flex items-center justify-end gap-2 text-xs text-muted-foreground">
          <span>数据备份：</span>
          <button id="btn-export" class="rounded-md border border-border bg-background px-2 py-1 text-xs text-foreground hover:bg-muted">导出记录</button>
          <button id="btn-import" class="rounded-md border border-border bg-background px-2 py-1 text-xs text-foreground hover:bg-muted">导入记录</button>
          <input type="file" id="import-file" accept="application/json" class="hidden">
        </div>

        <!-- 进度条 -->
        <section id="progress-bar" class="mt-4">
          <div class="mb-1 flex items-center justify-between text-xs text-muted-foreground">
            <span>总体进度</span>
            <div class="flex items-center gap-2">
              <span id="progress-text">0%</span>
              <button id="btn-marker-upload" class="inline-flex items-center gap-1 rounded border border-border bg-background px-1.5 py-0.5 text-[10px] text-foreground hover:bg-muted" aria-label="更换进度标记">
                <i data-lucide="image" class="h-3 w-3"></i> 换标记
              </button>
              <input type="file" id="marker-file" accept="image/*" class="hidden">
            </div>
          </div>
          <div class="relative h-4 w-full rounded-full bg-muted shadow-inner">
            <div id="progress-fill" class="h-4 rounded-full bg-primary shadow transition-all" style="width: 0%"></div>
            <img id="progress-marker" src="assets/progress-marker.svg" alt="进度标记" class="pointer-events-none absolute -top-7 h-10 w-auto -translate-x-1/2 transition-all">
          </div>
        </section>
      </div>
    </header>

    <!-- ===== 主体内容 ===== -->
    <div class="mx-auto max-w-6xl px-4 py-6">

      <!-- 周导航 -->
      <section id="week-navigation" class="mb-6 flex flex-col gap-3 rounded-xl border border-border bg-card p-4 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-2">
          <button id="btn-prev" class="inline-flex items-center gap-1 rounded-md border border-border bg-background px-3 py-2 text-sm font-medium text-foreground hover:bg-muted touch-target" aria-label="上一周">
            <i data-lucide="chevron-left" class="h-4 w-4"></i> <span class="hidden sm:inline">上一周</span>
          </button>
          <button id="btn-today" class="inline-flex items-center gap-1 rounded-md bg-primary px-3 py-2 text-sm font-medium text-primary-foreground hover:opacity-90 touch-target" aria-label="回到本周">
            <i data-lucide="calendar-check" class="h-4 w-4"></i> <span class="hidden sm:inline">今天</span>
          </button>
          <button id="btn-next" class="inline-flex items-center gap-1 rounded-md border border-border bg-background px-3 py-2 text-sm font-medium text-foreground hover:bg-muted touch-target" aria-label="下一周">
            <span class="hidden sm:inline">下一周</span> <i data-lucide="chevron-right" class="h-4 w-4"></i>
          </button>
        </div>
        <div class="flex items-center gap-3">
          <span id="week-label" class="text-sm font-semibold text-foreground">第 1 周</span>
          <select id="week-select" class="rounded-md border border-border bg-background px-2 py-1.5 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-ring"></select>
        </div>
      </section>

      <!-- 每周目标 -->
      <section id="weekly-goal" class="mb-6 rounded-xl border border-border bg-card p-5">
        <div class="mb-3 flex items-center gap-2">
          <i data-lucide="target" class="h-5 w-5 text-[var(--brand-primary)]"></i>
          <h2 class="text-lg font-semibold text-foreground">每周目标</h2>
          <span id="weekly-goal-label" class="ml-auto text-xs text-muted-foreground">第 1 周</span>
        </div>
        <textarea id="weekly-goal-input" data-week="" rows="3" class="w-full rounded-lg border border-border bg-background p-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-[var(--brand-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--brand-ring)]" placeholder="写下本周的学习目标..."></textarea>
      </section>

      <!-- 每日学习记录 -->
      <section id="daily-records" class="mb-6">
        <h2 class="mb-4 flex items-center gap-2 text-lg font-semibold text-foreground">
          <i data-lucide="book-open" class="h-5 w-5 text-[var(--brand-primary)]"></i>
          每日学习记录
        </h2>
        <div id="week-overview" class="mb-4 grid grid-cols-2 gap-2 sm:grid-cols-4 lg:grid-cols-7"></div>
        <div id="daily-cards" class="grid grid-cols-1 gap-4 md:grid-cols-2 xl:grid-cols-3"></div>
      </section>

      <!-- 每周复盘 -->
      <section id="weekly-review" class="mb-6 rounded-xl border border-border bg-card p-5">
        <div class="mb-3 flex items-center gap-2">
          <i data-lucide="clipboard-list" class="h-5 w-5 text-[var(--brand-primary)]"></i>
          <h2 class="text-lg font-semibold text-foreground">每周复盘</h2>
          <span id="weekly-review-label" class="ml-auto text-xs text-muted-foreground">第 1 周</span>
        </div>
        <textarea id="weekly-review-input" data-week="" rows="3" class="w-full rounded-lg border border-border bg-background p-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-[var(--brand-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--brand-ring)]" placeholder="回顾本周学习收获与不足..."></textarea>
      </section>

      <!-- 每月总结 -->
      <section id="monthly-summary" class="mb-6 rounded-xl border border-border bg-card p-5">
        <div class="mb-3 flex items-center gap-2">
          <i data-lucide="bar-chart-2" class="h-5 w-5 text-[var(--brand-primary)]"></i>
          <h2 class="text-lg font-semibold text-foreground">每月总结</h2>
          <span id="monthly-summary-label" class="ml-auto text-xs text-muted-foreground">2026年9月</span>
        </div>
        <textarea id="monthly-summary-input" data-month="" rows="4" class="w-full rounded-lg border border-border bg-background p-3 text-sm text-foreground placeholder:text-muted-foreground focus:border-[var(--brand-primary)] focus:outline-none focus:ring-2 focus:ring-[var(--brand-ring)]" placeholder="总结本月的学习成果、问题与下月计划..."></textarea>
      </section>

    </div>
  </main>

  <!-- Toast 容器 -->
  <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

  <!-- 移动端滑动提示 -->
  <div id="swipe-hint" class="swipe-hint">← 左右滑动切换周 →</div>

  <!-- ===== 模块化 JS（按依赖顺序加载）===== -->
  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/stats.js"></script>
  <script src="js/countdown.js"></script>
  <script src="js/week-nav.js"></script>
  <script src="js/day-cards.js"></script>
  <script src="js/text-areas.js"></script>
  <script src="js/io.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/gestures.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
